# reward_v3_social.yaml
# Phase 4.4.2 Economic-Aligned Reward Configuration (0.05 pts per $1 Social Cost)
# Aligns step rewards directly with economics_v1.yaml so serving critical &
# flexible demand dominates minor fuel/grid savings and battery throughput matches $15/MWh.

w_cost: 0.05          # $120/MWh import -> 6.0 pts/MWh; $1.50/L fuel -> 0.075 pts/L
w_crit_ens: 50.0      # 50.0 * 10 = 500 pts/MWh == 0.05 * $10,000/MWh Critical VoLL
w_flex_ens: 10.0      # 10.0 * 10 = 100 pts/MWh == 0.05 * $2,000/MWh Flexible VoLL
w_other_ens: 5.0      # 5.0 * 10 = 50 pts/MWh == 0.05 * $1,000/MWh Other VoLL
w_emissions: 0.005    # Mild carbon regularization
w_degrad: 0.075       # 0.075 * 10 = 0.75 pts/MWh == 0.05 * $15/MWh battery wear
w_voltage: 10.0       # Voltage excursion regularization
w_imbalance: 20.0     # Power balance enforcement
w_curt: 1.5           # Penalize unneeded RE curtailment (15 pts/MWh > import cost)
w_reserve: 4.0        # Smooth penalty for falling below 30% reserve
w_service: 1.0        # +1.0 pt/step bonus for serving critical demand
